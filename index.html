<!-- informs browser what HTML version to process -->
<!DOCTYPE html>

<!-- root element. all elements descend from this -->
<html lang="en">
    <!-- head element displays webpage's meta data, nothing else -->
    <head>
        <meta charset="UTF-8"> <!-- browser reads from this set -->
        <title>My First Webpage</title> <!-- displayed in browser -->
    </head>

    <!-- webpage content -->
    <body>
        
    </body>
</html>
